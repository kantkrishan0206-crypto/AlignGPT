name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check src/aligngpt tests benchmarking/reproducibility cli/evaluation_cli evaluation/scientific_metrics
      - name: Lint
        run: ruff check src/aligngpt tests benchmarking/reproducibility cli/evaluation_cli evaluation/scientific_metrics
      - name: Tests
        run: pytest --cov=aligngpt --cov-report=term-missing
