name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -f deployment/docker/Dockerfile -t aligngpt-api:${{ github.sha }} .
      - name: Deployment gate
        run: |
          echo "Container built. Publishing and environment promotion require configured registry credentials."

  deployment-hooks:
    runs-on: ubuntu-latest
    needs: build-container
    steps:
      - uses: actions/checkout@v4
      - name: Vercel hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
      - name: Render hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Railway token reminder
        if: ${{ secrets.RAILWAY_TOKEN == '' }}
        run: echo "Railway deployment is ready once RAILWAY_TOKEN is configured."
