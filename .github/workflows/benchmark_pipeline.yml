name: Benchmark Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "12 4 * * 2"

permissions:
  contents: read
  actions: read

jobs:
  operational-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Run reproducibility smoke benchmark
        run: python benchmarking/reproducibility/run_smoke_benchmark.py --output artifacts/benchmarks/smoke.json
      - name: Run operational benchmark bundle
        run: python benchmarking/reproducibility/run_operational_benchmark.py --output-dir artifacts/benchmarks/operational
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: aligngpt-benchmark-bundle
          path: artifacts/benchmarks
