[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aligngpt"
version = "0.2.0"
description = "Research-grade alignment platform scaffolding for RLHF, evaluation, safety, and AI product systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlignGPT contributors" }]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
ml = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "evaluate>=0.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "peft>=0.10",
  "scikit-learn>=1.4",
  "sentencepiece>=0.2",
  "torch>=2.2",
  "transformers>=4.40",
  "trl>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aligngpt*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "ml: requires optional ML dependencies or model artifacts",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
