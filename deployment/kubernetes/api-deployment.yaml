apiVersion: apps/v1
kind: Deployment
metadata:
  name: aligngpt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aligngpt-api
  template:
    metadata:
      labels:
        app: aligngpt-api
    spec:
      containers:
        - name: api
          image: ghcr.io/owner/aligngpt-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ALIGNGPT_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
